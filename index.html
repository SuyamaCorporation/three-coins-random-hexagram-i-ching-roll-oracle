<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易経六十四卦コインオラクル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0d0a1a; }
    .oracle-bg {
      background: radial-gradient(ellipse at 50% 20%, #1a0d2e 0%, #0d0a1a 60%);
    }
    .parchment {
      background: linear-gradient(135deg, #1a1008 0%, #221505 50%, #1a1008 100%);
      border: 1px solid #5a3e10;
    }
    .coin-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 3px solid #d4a853;
      background: radial-gradient(circle at 35% 35%, #f0c860, #8b6914);
      display: flex; align-items: center; justify-content: center;
      user-select: none;
      box-shadow: 0 4px 15px rgba(212,168,83,0.3);
    }
    .coin-btn:hover:not(:disabled) {
      transform: scale(1.1) rotate(10deg);
      box-shadow: 0 8px 25px rgba(212,168,83,0.5);
    }
    .coin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .coin-btn.casting {
      animation: coinSpin 0.6s ease;
    }
    @keyframes coinSpin {
      0% { transform: rotateY(0); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    .line-yang {
      height: 12px; background: #d4a853;
      margin: 4px 0; border-radius: 2px;
    }
    .line-yin {
      height: 12px;
      margin: 4px 0;
      display: flex; gap: 8px;
    }
    .line-yin .half {
      flex: 1; background: #d4a853; border-radius: 2px; height: 100%;
    }
    .line-changing .line-yang, .line-changing .half {
      background: #ef4444;
    }
    .line-changing .mark {
      color: #ef4444;
      font-size: 0.65rem;
      margin-left: 4px;
    }
    .hexagram-char {
      font-size: 5rem;
      line-height: 1;
      text-shadow: 0 0 20px rgba(212,168,83,0.6);
    }
    .throw-result {
      animation: throwIn 0.4s ease;
    }
    @keyframes throwIn {
      from { opacity: 0; transform: translateY(-15px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .reveal-anim {
      animation: reveal 0.8s ease;
    }
    @keyframes reveal {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .throw-history-line {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8rem;
    }
    .coin-toss-mini {
      display: inline-block;
      width: 18px; height: 18px; border-radius: 50%;
      border: 1px solid #d4a853;
      text-align: center; line-height: 18px;
      font-size: 0.7rem;
    }
  </style>
</head>
<body class="oracle-bg min-h-screen text-amber-100 p-4">

<div class="max-w-3xl mx-auto">
  <!-- Header -->
  <header class="text-center mb-6 pt-4">
    <h1 class="text-3xl md:text-4xl font-bold text-yellow-300 mb-1" style="font-family:Georgia,serif; text-shadow: 0 0 20px rgba(212,168,83,0.4)">
      ☯ 易経六十四卦 I Ching Oracle ☯
    </h1>
    <p class="text-amber-500 text-sm">コイン3枚投げ・ランダム占いオラクル</p>
  </header>

  <!-- Instructions & Coin Throw -->
  <div class="parchment rounded-2xl p-5 mb-5">
    <div class="text-center mb-4">
      <p class="text-amber-400 text-sm mb-1">
        コインを6回投げて六爻を積み上げよ（1回目=第一爻 下から）
      </p>
      <p class="text-amber-700 text-xs">
        表3枚=老陽(━━ 変) ／ 表2枚=少陽(━━) ／ 裏2枚=少陰(━ ━) ／ 裏3枚=老陰(━ ━ 変)
      </p>
    </div>

    <!-- Throw Progress -->
    <div class="flex items-center justify-center gap-2 mb-5">
      <span class="text-amber-600 text-sm">第</span>
      <span id="throwCount" class="text-yellow-300 text-2xl font-bold">1</span>
      <span class="text-amber-600 text-sm">爻</span>
      <span class="text-amber-800 text-sm ml-2">(残り <span id="remaining">6</span> 回)</span>
    </div>

    <!-- Three Coins Display -->
    <div class="flex justify-center gap-6 mb-5" role="group" aria-label="3枚のコイン">
      <div class="text-center">
        <button class="coin-btn" id="castBtn"
          aria-label="コイン3枚を投げる (クリックまたはEnterキー)">
          🪙
        </button>
        <p class="text-xs text-amber-600 mt-2">クリックして投げる</p>
      </div>
    </div>

    <!-- Throw Results History -->
    <div id="throwHistory" class="space-y-2 min-h-8" aria-live="polite" aria-label="投げた結果の履歴">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- Hexagram Display -->
  <div id="hexagramPanel" class="hidden parchment rounded-2xl p-5 mb-5 reveal-anim" aria-live="polite">
    <!-- Filled by JS -->
  </div>

  <!-- Changed Hexagram -->
  <div id="changedPanel" class="hidden parchment rounded-2xl p-5 mb-5" aria-live="polite">
    <!-- Filled by JS -->
  </div>

  <!-- Reset -->
  <div class="text-center">
    <button id="resetBtn"
      class="bg-gray-800 hover:bg-gray-700 text-amber-300 px-6 py-3 rounded-xl transition-all focus:ring-2 focus:ring-amber-500"
      aria-label="最初からやり直す">
      🔄 新しい占い
    </button>
  </div>
</div>

    { num:58, name:'兌',  reading:'だ',    en:'The Joyous',      char:'☱', unicode:'䷹', summary:'悦び・喜び。沢の喜び。真の喜びは内から生まれる。', interpretation:'喜びと交流の時。誠実な喜びで人々をつなぎ前進せよ。'},
    { num:59, name:'渙',  reading:'かん',  en:'Dispersion',      char:'☴', unicode:'䷺', summary:'散乱・溶解。凝り固まりを解く。聖なる集まりで統一を。', interpretation:'分散した力を再統一する時。精神的な絆で人々を集めよ。'},
    { num:60, name:'節',  reading:'せつ',  en:'Limitation',      char:'☵', unicode:'䷻', summary:'節制・制限。節度ある限界。厳しすぎない節制が吉。', interpretation:'節制の時。自らに適切な制限を設け、節度を守って進め。'},
    { num:61, name:'中孚', reading:'ちゅうふ',en:'Inner Truth',  char:'☴', unicode:'䷼', summary:'内なる誠実。心の真実。誠実さが全てを動かす。', interpretation:'内面の誠実さが最大の力となる。真実の心で人を動かせ。'},
    { num:62, name:'小過', reading:'しょうか',en:'Small Exceeding', char:'☳', unicode:'䷽', summary:'小さな超過。鳥が飛びすぎる。慎み深く小事を行え。', interpretation:'小さな超過は許されるが大事は控えよ。謙虚に小歩を積め。'},
    { num:63, name:'既済', reading:'きせい',en:'After Completion', char:'☵', unicode:'䷾', summary:'完成・達成。全てが完了した。しかし次の崩壊に備えよ。', interpretation:'完成の時。しかし慢心は禁物。次の崩壊に備え秩序を保て。'},
    { num:64, name:'未済', reading:'みせい',en:'Before Completion', char:'☲', unicode:'䷿', summary:'未完成・移行期。渡る前の最後の一歩。慎重に完成へ。', interpretation:'完成直前の最も危険な時。最後まで油断せず慎重に進め。'},
  ];

  // King Wen sequence mapping: upper trigram * 8 + lower trigram -> hexagram index
  // Trigrams: ☰=0,☱=1,☲=2,☳=3,☴=4,☵=5,☶=6,☷=7
  // King Wen sequence (hex number by upper/lower trigram combo)
  // Using standard lookup table
  const TRIGRAM_TO_HEX = [
  //lower: 0  1  2  3  4  5  6  7
           1, 43,14,34, 9, 5,26,11, // upper 0 (☰)
          10, 58,38,54,61,60,41,19, // upper 1 (☱)
          13,49,30,55,37,63,22,36, // upper 2 (☲)
          25,17,21,51,42,3,27,24,  // upper 3 (☳)
          44,28,50,32,57,48,18,46, // upper 4 (☴)
           6,47,64,40,59,29,4,7,  // upper 5 (☵)
          33,31,56,62,53,39,52,15, // upper 6 (☶)
          12,45,35,16,20, 8,23, 2, // upper 7 (☷)
  ];

  const TRIGRAM_NAMES = ['☰ 乾','☱ 兌','☲ 離','☳ 震','☴ 巽','☵ 坎','☶ 艮','☷ 坤'];

  // =====================
  // STATE
  // =====================
  // Each throw result: { heads (0-3), lineType: 'oldYang'|'youngYang'|'youngYin'|'oldYin', changing: bool, yang: bool }
  let throws = [];
  let done = false;

  // Line type from coin throws:
  // 3 heads (表) = old yang (changing yang)  value=9
  // 2 heads 1 tail = young yang              value=8 (wait, standard: 3H=9=老陽, 2H=8=少陰??)
  // Actually: standard 3-coin method:
  // heads=3 (all H) → old yang (老陽, 9) → yang line, changing
  // heads=2 (2H+1T) → young yang (少陽, 7) → yang line
  // heads=1 (1H+2T) → young yin (少陰, 8) → yin line
  // heads=0 (all T) → old yin (老陰, 6) → yin line, changing
  // Note: coin=head=3pts, tail=2pts → sum: HHH=9, HHT=8, HTT=7, TTT=6
  // Let's use this:
  // 3 heads → sum=9=old yang → yang, changing
  // 2 heads → sum=8=young yin → yin (NOT changing)  ← Note this is "young yin" = yin line
  // 1 head  → sum=7=young yang → yang (NOT changing) ← "young yang" = yang line
  // 0 heads → sum=6=old yin → yin, changing

  function throwCoins() {
    // Simulate 3 coin flips
    const flips = [Math.random() < 0.5, Math.random() < 0.5, Math.random() < 0.5];
    const heads = flips.filter(Boolean).length;

    let yang, changing, typeName, typeJP;
    if (heads === 3) {
      yang = true; changing = true;
      typeName = 'Old Yang (老陽)'; typeJP = '老陽 ━━ ×';
    } else if (heads === 2) {
      yang = false; changing = false;
      typeName = 'Young Yin (少陰)'; typeJP = '少陰 ━ ━';
    } else if (heads === 1) {
      yang = true; changing = false;
      typeName = 'Young Yang (少陽)'; typeJP = '少陽 ━━';
    } else {
      yang = false; changing = true;
      typeName = 'Old Yin (老陰)'; typeJP = '老陰 ━ ━ ×';
    }

    return { flips, heads, yang, changing, typeName, typeJP };
  }

  function getLinesAsLines(throwArr) {
    // Returns array from bottom (line 1) to top (line 6)
    return throwArr.map(t => ({ yang: t.yang, changing: t.changing }));
  }

  function linesTo3BitTrigram(lines) {
    // lines[0]=bottom, lines[1]=middle, lines[2]=top → 3-bit (top<<2|mid<<1|bot)
    // Standard trigram encoding: ☰=111=7? Let's use: bit2=top, bit1=mid, bit0=bot
    // 0=000: ☷ 坤, 1=001: ☳ 震, 2=010: ☵ 坎, 3=011: ☶ 艮, 4=100: ☴ 巽, 5=101: ☲ 離, 6=110: ☱ 兌, 7=111: ☰ 乾
    // But King Wen uses: ☰=0,☱=1,☲=2,☳=3,☴=4,☵=5,☶=6,☷=7
    // Map bit pattern to King Wen index:
    const bit = (lines[2].yang ? 4 : 0) | (lines[1].yang ? 2 : 0) | (lines[0].yang ? 1 : 0);
    // bit pattern to King Wen index
    const bitToKW = [7, 3, 5, 6, 4, 2, 1, 0]; // 000→☷(7), 001→☳(3), 010→☵(5), 011→☶(6), 100→☴(4), 101→☲(2), 110→☱(1), 111→☰(0)
    return bitToKW[bit];
  }

  function computeHexagram(lines) {
    // lines: array of 6, bottom to top
    const lower = linesTo3BitTrigram(lines.slice(0, 3));
    const upper = linesTo3BitTrigram(lines.slice(3, 6));
    const hexNum = TRIGRAM_TO_HEX[upper * 8 + lower];
    return { hexNum, lower, upper };
  }

  function computeChangedHexagram(lines) {
    // Flip changing lines
    const changed = lines.map(l => ({ ...l, yang: l.changing ? !l.yang : l.yang, changing: false }));
    const lower = linesTo3BitTrigram(changed.slice(0, 3));
    const upper = linesTo3BitTrigram(changed.slice(3, 6));
    const hexNum = TRIGRAM_TO_HEX[upper * 8 + lower];
    return { hexNum, lower, upper, lines: changed };
  }

  // =====================
  // RENDER
  // =====================
  function updateThrowUI() {
    const count = throws.length + 1;
    const remaining = 6 - throws.length;
    document.getElementById('throwCount').textContent = count > 6 ? 6 : count;
    document.getElementById('remaining').textContent = remaining >= 0 ? remaining : 0;

    // Render history
    const hist = document.getElementById('throwHistory');
    hist.innerHTML = '';
    throws.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'throw-result flex items-center gap-3 p-2 rounded-lg bg-black bg-opacity-30';

      const label = document.createElement('span');
      label.className = 'text-xs text-amber-700 w-14 flex-shrink-0';
      label.textContent = `第${i + 1}爻:`;

      const coins = document.createElement('span');
      coins.className = 'flex gap-1';
      t.flips.forEach(h => {
        const c = document.createElement('span');
        c.className = 'coin-toss-mini ' + (h ? 'bg-yellow-800 text-yellow-200' : 'bg-gray-700 text-gray-400');
        c.textContent = h ? '表' : '裏';
        coins.appendChild(c);
      });

      const typEl = document.createElement('span');
      typEl.className = 'text-xs font-semibold ' + (t.changing ? 'text-red-400' : 'text-amber-300');
      typEl.textContent = t.typeJP;

      div.appendChild(label);
      div.appendChild(coins);
      div.appendChild(typEl);
      hist.appendChild(div);
    });
  }

  function renderHexagramVisual(lines, panelId, title, hexData) {
    const hex = HEXAGRAMS.find(h => h.num === hexData.hexNum) || HEXAGRAMS[0];
    const panel = document.getElementById(panelId);
    panel.classList.remove('hidden');
    panel.innerHTML = '';

    // Title
    const h2 = document.createElement('h2');
    h2.className = 'text-center text-yellow-400 font-bold text-lg mb-4';
    h2.style.fontFamily = 'Georgia, serif';
    h2.textContent = title;
    panel.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'flex flex-col md:flex-row gap-6 items-center md:items-start';

    // Left: hexagram visual (lines from top to bottom visually = line 6 at top)
    const visualDiv = document.createElement('div');
    visualDiv.className = 'flex flex-col items-center gap-1 w-40 flex-shrink-0';

    // Hexagram character
    const charEl = document.createElement('div');
    charEl.className = 'hexagram-char text-yellow-300 mb-3';
    charEl.setAttribute('aria-label', `六十四卦第${hex.num}卦 ${hex.name}`);
    charEl.textContent = hex.unicode;
    visualDiv.appendChild(charEl);

    // Draw lines (top to bottom = line 6 to line 1 visually)
    for (let i = 5; i >= 0; i--) {
      const line = lines[i];
      const lineDiv = document.createElement('div');
      lineDiv.className = 'w-32 ' + (line.changing ? 'line-changing' : '');
      lineDiv.setAttribute('aria-label', `第${i + 1}爻 ${line.yang ? '陽' : '陰'}${line.changing ? '変爻' : ''}`);

      if (line.yang) {
        const bar = document.createElement('div');
        bar.className = 'line-yang';
        lineDiv.appendChild(bar);
      } else {
        const yin = document.createElement('div');
        yin.className = 'line-yin';
        const h1 = document.createElement('div');
        h1.className = 'half';
        const h2d = document.createElement('div');
        h2d.className = 'half';
        yin.appendChild(h1);
        yin.appendChild(h2d);
        lineDiv.appendChild(yin);
      }

      if (line.changing) {
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = '← 変';
        lineDiv.appendChild(mark);
      }

      visualDiv.appendChild(lineDiv);
    }

    // Line numbers (bottom to top)
    const numDiv = document.createElement('div');
    numDiv.className = 'flex flex-col-reverse items-center text-xs text-amber-800 mt-1 gap-1';
    for (let i = 1; i <= 6; i++) {
      const s = document.createElement('span');
      s.style.height = '20px';
      s.style.lineHeight = '20px';
      s.textContent = `第${i}爻`;
      numDiv.appendChild(s);
    }

    grid.appendChild(visualDiv);

    // Right: hexagram info
    const infoDiv = document.createElement('div');
    infoDiv.className = 'flex-1 min-w-0';

    const numEl = document.createElement('div');
    numEl.className = 'text-amber-600 text-xs mb-1';
    numEl.textContent = `第${hex.num}卦`;

    const nameEl = document.createElement('div');
    nameEl.className = 'text-yellow-200 text-3xl font-bold mb-1';
    nameEl.style.fontFamily = 'Georgia, serif';
    nameEl.textContent = `${hex.name}（${hex.reading}）`;

    const enEl = document.createElement('div');
    enEl.className = 'text-amber-500 text-sm italic mb-3';
    enEl.textContent = hex.en;

    const trigramEl = document.createElement('div');
    trigramEl.className = 'text-xs text-amber-700 mb-3';
    trigramEl.textContent = `上卦: ${TRIGRAM_NAMES[hexData.upper]} ／ 下卦: ${TRIGRAM_NAMES[hexData.lower]}`;

    const summaryEl = document.createElement('p');
    summaryEl.className = 'text-amber-300 text-sm mb-2 leading-relaxed';
    summaryEl.textContent = hex.summary;

    const interpLabel = document.createElement('p');
    interpLabel.className = 'text-xs text-amber-700 mb-1 font-bold uppercase tracking-wider';
    interpLabel.textContent = '解釈 (Interpretation)';

    const interpEl = document.createElement('p');
    interpEl.className = 'text-amber-100 text-sm leading-relaxed bg-black bg-opacity-30 rounded-lg p-3';
    interpEl.textContent = hex.interpretation;

    infoDiv.appendChild(numEl);
    infoDiv.appendChild(nameEl);
    infoDiv.appendChild(enEl);
    infoDiv.appendChild(trigramEl);
    infoDiv.appendChild(summaryEl);
    infoDiv.appendChild(interpLabel);
    infoDiv.appendChild(interpEl);

    grid.appendChild(infoDiv);
    panel.appendChild(grid);
  }

  function handleCast() {
    if (done || throws.length >= 6) return;

    const btn = document.getElementById('castBtn');
    btn.classList.add('casting');
    setTimeout(() => btn.classList.remove('casting'), 600);

    const result = throwCoins();
    throws.push(result);
    updateThrowUI();

    if (throws.length === 6) {
      done = true;
      btn.disabled = true;
      document.getElementById('throwCount').textContent = '完了';
      document.getElementById('remaining').textContent = '0';

      const lines = getLinesAsLines(throws);
      const hexData = computeHexagram(lines);
      renderHexagramVisual(lines, 'hexagramPanel', '卦の結果 (Primary Hexagram)', hexData);

      const hasChanging = lines.some(l => l.changing);
      if (hasChanging) {
        const changedData = computeChangedHexagram(lines);
        const changedLines = lines.map(l => ({ yang: l.changing ? !l.yang : l.yang, changing: false }));
        renderHexagramVisual(changedLines, 'changedPanel', '変爻後の卦 (Changed Hexagram)', changedData);
      }
    }
  }

  // =====================
  // INIT
  // =====================
  document.getElementById('castBtn').addEventListener('click', handleCast);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      if (document.activeElement.tagName !== 'BUTTON') {
        handleCast();
      }
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    throws = [];
    done = false;
    document.getElementById('castBtn').disabled = false;
    document.getElementById('throwCount').textContent = '1';
    document.getElementById('remaining').textContent = '6';
    document.getElementById('throwHistory').innerHTML = '';
    document.getElementById('hexagramPanel').classList.add('hidden');
    document.getElementById('changedPanel').classList.add('hidden');
  });

  updateThrowUI();
</script>
